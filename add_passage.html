<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="add_passage.css" />
    <title>إضافة مقال</title>
  </head>
  <body style="height: 100%">
    <form dir="rtl" name="f1" id="passage-form" style="height: 100%">
      <h1>إضافة مقال جديد</h1>
      <input
        type="text"
        name="title"
        id="title"
        placeholder="عنوان المقال"
        required
      />
      <textarea
        name="content"
        id="content"
        cols="30"
        rows="10"
        placeholder="محتوى المقال"
        required
      ></textarea>
      <button type="submit" id="submitBtn">إضافة المقال</button>
    </form>
  </body>
  <script src="add_passage.js"></script>
</html>
