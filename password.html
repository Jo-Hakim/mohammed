<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
  </head>
  <body dir="rtl">
    <form dir="rtl" name="f1">
      <h1>يجب التأكد من أنك محمد حكيم</h1>
      <input type="password" name="password" id="" placeholder="كلمة المرور" />
      <button id="addBtn">تسجيل</button>
    </form>
    <style>
      body {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      button {
        display: block;
        width: 30%;
        padding: 10px;
        margin: 20px auto;
        border: none;
        border-radius: 5px;
        background-color: red;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      form {
        width: 500px;
        height: 500px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }
      input[type="password"] {
        width: 60%;
        height: 40px;
        padding: 10px;
        margin: 10px auto;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      form h1 {
        text-align: center;
        margin-bottom: 20px;
      }
    </style>
  </body>
  <script>
    document.getElementById("addBtn").addEventListener("click", function (e) {
      e.preventDefault();
      const enteredPassword = document.f1.password.value;
      async function fetchPassword() {
        try {
          const response = await fetch(
            "http://CodeSamurai.pythonanywhere.com/get-password"
          );
          const data = await response.json();
          return data.password;
          // You can use data.password in your logic here
        } catch (error) {
          alert("Error fetching password:", error);
        }
      }
      let realPassword = fetchPassword();
      if (realPassword === enteredPassword) {
        window.location.href = "add_passage.html";
      } else {
        alert("كلمة المرور غير صحيحة");
      }
    });
  </script>
</html>
