<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول</title>
  </head>
  <body dir="rtl">
    <form dir="rtl" name="f1">
      <h1>يجب التأكد من أنك محمد حكيم</h1>
      <input
        type="password"
        name="password"
        id="password-field"
        placeholder="كلمة المرور"
      />
      <button id="addBtn">تسجيل</button>
    </form>
    <style>
      body {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* الزرار */
      button {
        display: block;
        width: 30%;
        padding: 10px;
        margin: 20px auto;
        border: none;
        border-radius: 5px;
        background-color: red;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      /* الفورم */
      form {
        width: 500px;
        height: 500px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      input[type="password"] {
        width: 60%;
        height: 40px;
        padding: 10px;
        margin: 10px auto;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      form h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      /* ############### MEDIA QUERIES ################ */

      /* شاشات الموبايل الصغيرة (أقل من 480px) */
      @media (max-width: 480px) {
        form {
          width: 90%;
          height: auto;
          padding: 15px;
        }

        input[type="password"] {
          width: 90%;
          font-size: 14px;
        }

        button {
          width: 80%;
          font-size: 14px;
          padding: 8px;
        }

        form h1 {
          font-size: 18px;
        }
      }

      /* شاشات التابلت (481px لحد 768px) */
      @media (max-width: 768px) {
        form {
          width: 80%;
          height: auto;
          padding: 20px;
        }

        input[type="password"] {
          width: 80%;
          font-size: 15px;
        }

        button {
          width: 60%;
          font-size: 15px;
        }

        form h1 {
          font-size: 20px;
        }
      }

      /* شاشات اللابتوب الصغيرة والمتوسطة */
      @media (max-width: 1024px) {
        form {
          width: 70%;
          height: auto;
        }

        input[type="password"] {
          width: 70%;
        }

        button {
          width: 40%;
        }
      }
    </style>
  </body>
  <script>
    let password = document.getElementById("password-field").value;
    document.getElementById("addBtn").addEventListener("click", function (e) {
      e.preventDefault();
      async function fetchPassword() {
        try {
          const response = await fetch(
            "http://CodeSamurai.pythonanywhere.com/get-password"
          );
          const data = await response.json();
          return data.password;
          // You can use data.password in your logic here
        } catch (error) {
          alert("Error fetching password:", error);
        }
      }
      let realPassword = fetchPassword();
      if (password == "afuo".split("").reverse().join("")) {
        window.location.href = "add_passage.html";
        return false;
      } else {
        alert("كلمة المرور غير صحيحة");
        return false;
      }
    });
  </script>
</html>
